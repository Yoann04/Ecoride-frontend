<div class="wrap">
  <h1>Mes réservations</h1>

  <div *ngIf="loading" class="skeleton"></div>
  <p *ngIf="!loading && error" class="error">{{ error }}</p>

  <ng-container *ngIf="!loading && !error">
    <p *ngIf="trips.length === 0" class="muted">Aucune réservation pour l’instant.</p>

    <ul class="list" *ngIf="trips.length > 0">
      <li *ngFor="let t of trips" class="item">
        <div class="title">
          {{ t.departureCity }} → {{ t.arrivalCity }}
          <span class="price">{{ t.price | number : '1.2-2' }} €</span>
        </div>
        <div class="meta">
          Le {{ t.departureDate | date : 'dd/MM/yyyy' }} • Conducteur : {{ name(t) }}
        </div>
        <a [routerLink]="['/trips', t.id]" class="btn">Voir</a>
      </li>
    </ul>
  </ng-container>
</div>
