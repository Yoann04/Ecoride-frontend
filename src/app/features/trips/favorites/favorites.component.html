<div class="wrap">
  <h1>Mes trajets favoris</h1>

  <p *ngIf="loading" class="muted">Chargement…</p>
  <p *ngIf="!loading && error" class="error">{{ error }}</p>

  <section class="list" *ngIf="!loading && !error && trips.length > 0">
    <article class="card" *ngFor="let t of trips">
      <div class="route">
        <div class="line">
          <span class="city">{{ t.departureCity }}</span>
          <span class="arrow">→</span>
          <span class="city">{{ t.arrivalCity }}</span>
        </div>
        <div class="meta">
          <span>{{ t.departureDate }}</span>
          <span *ngIf="t.departureTime">&nbsp;•&nbsp;{{ t.departureTime }}</span>
        </div>
      </div>

      <div class="right">
        <div class="price">{{ t.price | number : '1.2-2' }} €</div>
        <a class="btn" [routerLink]="['/trips', t.id]">Voir</a>
      </div>
    </article>
  </section>

  <p *ngIf="!loading && !error && trips.length === 0" class="muted">Aucun favori pour le moment.</p>
</div>
