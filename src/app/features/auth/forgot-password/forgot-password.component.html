<section class="auth page-auth">
  <div class="auth-shell">
    <div class="panel">
      <h1>Mot de passe oublié</h1>
      <p class="sub">Saisissez votre email pour recevoir un lien de réinitialisation.</p>

      <form (ngSubmit)="submit()" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" [(ngModel)]="email" required />
        </div>

        <button class="btn primary" type="submit" [disabled]="loading || !email">
          Envoyer le lien
        </button>

        <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
        <p *ngIf="done" class="success">Email envoyé ! Vérifiez votre boîte de réception.</p>

        <p class="hint">
          <a routerLink="/login">Retour à la connexion</a>
        </p>
      </form>
    </div>

    <aside class="art" aria-hidden="true">
      <div class="art-illus"></div>
      <ul class="bullets">
        <li>🔒 Procédure sécurisée</li>
        <li>📬 Lien envoyé par email</li>
        <li>⏱️ Quelques secondes seulement</li>
      </ul>
    </aside>
  </div>
</section>
