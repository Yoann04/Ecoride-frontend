<div class="login-page">
  <h1>Connexion</h1>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="card">
    <label>
      <span>Email</span>
      <input type="email" formControlName="email" placeholder="alice@example.com" />
    </label>

    <label>
      <span>Mot de passe</span>
      <input type="password" formControlName="password" placeholder="Password123!" />
    </label>

    <button type="submit" [disabled]="form.invalid || loading()">
      {{ loading() ? 'Connexion…' : 'Se connecter' }}
    </button>

    <p class="error" *ngIf="errorMsg()">{{ errorMsg() }}</p>
  </form>

  <p class="demo">Démo : <code>alice@example.com</code> / <code>Password123!</code></p>
</div>
<p *ngIf="successMsg()" style="color: #118a00; font-weight: 700">
  {{ successMsg() }}
</p>
<p *ngIf="errorMsg()" style="color: #d00; font-weight: 700">
  {{ errorMsg() }}
</p>
